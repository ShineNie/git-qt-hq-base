; This is a config file for providing infomation of database connection. It supports
; many types of database,those depends on the application developer.
;
; db_type supports:
;
;     sqllite,mysql,access,...
;
; If the database type is sqllite,only the databasename be used. It'll be a absolute
; or relative filepath.The most time, we suggest to use the relative path that was
; same to application,it like this: path/to/file.
;
; If the database type is access,only the databasename be used too. It'll be a
; connection string, it likes below:
;
; DRIVER={Microsoft Access Driver (*.mdb, *.accdb)};FIL={MS Access};DBQ=access.mdb;Uid=;Pwd=;
;
; If the reader has any question of the file and its uses.The more helping message will
; be got from the author:niexin.
;
; Thanks for reading this.

[db]
db_type  =SqlLite
hostname =
port     =
db_name  =Qt-HQ_Base.db
username =
password =